services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: pr_helper
      POSTGRES_USER: pr_user
      POSTGRES_PASSWORD: pr_pass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pr_user -d pr_helper"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  test:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://pr_user:pr_pass@db:5432/pr_helper
      POSTGRES_DB: pr_helper
      POSTGRES_USER: pr_user
      POSTGRES_PASSWORD: pr_pass
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DEBUG: "False"
    command: >
      sh -c "python manage.py migrate &&
             python manage.py test bulk_pr"
