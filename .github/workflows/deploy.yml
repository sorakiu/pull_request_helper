name: Deploy to GCP

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      run: |
        cd backend
        python manage.py test

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Build frontend
      run: |
        cd frontend
        npm ci
        npm run build

    - name: Build and push Docker image
      run: |
        docker build -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/pr-helper:${{ github.sha }} .
        docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/pr-helper:${{ github.sha }}

    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy pr-helper --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/pr-helper:${{ github.sha }} --platform managed --region us-central1 --allow-unauthenticated